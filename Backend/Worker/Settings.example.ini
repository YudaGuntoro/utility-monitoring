[Database]
ConnectionString=Server=host.docker.internal;Port=3306;User ID=root;Password=change_me;Database=utility-system;SslMode=None;AllowPublicKeyRetrieval=True;

[MQTT]
Host=broker.emqx.io
Port=1883
ClientId=UtilityMonitoringWorker
Qos=1
Topics=utility/power/+/telemetry

[Simulator]
Enabled=true
IntervalSeconds=5
Qos=1
Devices=PM-01,PM-02,PM-03

[Worker]
IntervalSeconds=1
ReconnectDelaySeconds=3
DowntimeDatabaseFallbackMinutes=10

[MainServer]
UploadUrl=
TimeoutSeconds=5

[Buffer]
MaxReprocessBatch=100

[Redis]
ConnectionString=redis:6379
BufferKey=utility:mqtt:buffer
