DowntimeDatabaseFallbackMinutes=10

[MainServer]
UploadUrl=
TimeoutSeconds=5

[Buffer]
MaxReprocessBatch=100

[Redis]
ConnectionString=redis:6379
BufferKey=utility:mqtt:buffer
