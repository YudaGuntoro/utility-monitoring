name: utility-monitoring

services:
  api:
    build:
      context: ./Backend
      dockerfile: Web.API/Dockerfile
    image: utility-monitoring-api:latest
    container_name: utility-monitoring-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${MYSQL_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER:-UtilityMonitoring}
      Jwt__Audience: ${JWT_AUDIENCE:-UtilityMonitoring.Frontend}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__ExpiresHours: ${JWT_EXPIRES_HOURS:-8}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:8091}
    ports:
      - "${API_HOST_PORT:-5274}:8080"
    networks:
      - utility-monitoring-net

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    image: utility-monitoring-web:latest
    container_name: utility-monitoring-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://api:8080}
    ports:
      - "${FRONTEND_HOST_PORT:-8091}:3000"
    networks:
      - utility-monitoring-net

  mqtt-broker:
    build:
      context: ./Backend
      dockerfile: MqttBrokerService/Dockerfile
    image: utility-monitoring-mqtt-broker:latest
    container_name: utility-monitoring-mqtt-broker
    restart: unless-stopped
    environment:
      BROKER_HOST: 0.0.0.0
      BROKER_PORT: 1883
    expose:
      - "1883"
    networks:
      - utility-monitoring-net

  worker:
    build:
      context: ./Backend/Worker
      dockerfile: Dockerfile
    image: utility-monitoring-worker:latest
    container_name: utility-monitoring-worker
    restart: unless-stopped
    depends_on:
      - api
      - mqtt-broker
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-Worker}
      MQTT_TOPIC: ${MQTT_TOPIC:-utility/power/+/telemetry}
      MQTT_QOS: ${MQTT_QOS:-2}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-1}
      SIMULATOR_DEVICES: ${SIMULATOR_DEVICES:-PM-01,PM-02,PM-03}
      SIMULATOR_QOS: ${SIMULATOR_QOS:-1}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-1}
      WORKER_RECONNECT_DELAY_SECONDS: ${WORKER_RECONNECT_DELAY_SECONDS:-3}
      WORKER_DOWNTIME_DATABASE_FALLBACK_MINUTES: ${WORKER_DOWNTIME_DATABASE_FALLBACK_MINUTES:-10}
      MAIN_SERVER_UPLOAD_URL: ${MAIN_SERVER_UPLOAD_URL:-}
      MAIN_SERVER_TIMEOUT_SECONDS: ${MAIN_SERVER_TIMEOUT_SECONDS:-5}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING:-redis:6379}
      REDIS_BUFFER_KEY: ${REDIS_BUFFER_KEY:-utility:mqtt:buffer}
    volumes:
      - utility-monitoring-worker-buffer:/app/buffer
    networks:
      - utility-monitoring-net

  redis:
    image: redis:7-alpine
    container_name: utility-monitoring-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - utility-monitoring-redis-data:/data
    networks:
      - utility-monitoring-net

networks:
  utility-monitoring-net:
    driver: bridge

volumes:
  utility-monitoring-worker-buffer:
  utility-monitoring-redis-data:
